{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Incident</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">

    <!-- Header -->
    <div class="flex items-center space-x-3 mb-6">
        <div class="bg-blue-600 p-2 rounded-lg">
            <i data-lucide="shield-alert" class="w-5 h-5 text-white"></i>
        </div>
        <div>
            <h2 class="text-xl font-bold text-white">
                Submit Security Incident
            </h2>
            <p class="text-sm text-slate-400">
                Provide accurate details for AI-based risk analysis.
            </p>
        </div>
    </div>

    <!-- Form -->
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">
                Incident Title
            </label>
            <input type="text" name="title"
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
                   required>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">
                Incident Description
            </label>
            <textarea name="description" rows="5"
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
                required></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">
                Upload Evidence (Optional)
            </label>
            <input type="file" name="evidence_file"
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 file:bg-blue-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-lg">
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 text-sm text-slate-400">
            ⚠ After submission, this incident will be processed by AI risk analysis.
            Severity and risk score will be assigned automatically.
        </div>

        <div class="flex justify-between items-center">
            <a href="{% url 'reporter_dashboard' %}"
               class="text-slate-400 hover:text-white text-sm">
                Cancel
            </a>

            <button type="submit"
                class="bg-blue-600 hover:bg-blue-500 transition px-6 py-3 rounded-lg font-semibold shadow-lg shadow-blue-900/30">
                Submit Incident
            </button>
        </div>

    </form>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
